  <!-- ==== SOL: tanitim ==== -->
  <rect x="90" y="96" width="64" height="64" rx="17" fill="url(#brand)"/>
  <circle cx="122" cy="128" r="19" fill="none" stroke="#ffffff" stroke-width="4.5"/>
