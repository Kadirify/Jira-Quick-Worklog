  <text x="92" y="262" font-size="21" fill="#4b5563">Bu eklenti o derdi bitiriyor: işin yanındaki</text>
  <text x="92" y="292" font-size="21" fill="#4b5563">çipe dokun, saniyeler içinde girildi.</text>

