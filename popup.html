<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>Jira Quick Worklog</title>
  </head>
  <body>
    <!-- KURULUM GEREKLI -->
    <section id="setup" class="screen hidden">
      <div class="setup-box">
        <img src="icons/icon48.png" alt="" width="44" height="44" />
        <h2>Hoş geldin 👋</h2>
        <p>Başlamak için Jira adresini, e-postanı ve API token'ını bir defa gir.</p>
        <button id="goOptions" class="primary block">Ayarları Aç</button>
      </div>
    </section>

    <!-- ANA EKRAN -->
    <section id="main" class="screen hidden">
      <header class="topbar">
        <div class="brand">
          <img src="icons/icon16.png" alt="" width="18" height="18" />
          <span>Quick Worklog</span>
        </div>
        <div class="top-actions">
          <select id="accountSelect" class="acct-select" title="Aktif hesap"></select>
          <button id="settings" class="icon-btn" title="Ayarlar">⚙</button>
        </div>
      </header>

      <!-- Tarih + ilerleme -->
      <div class="daybar">
        <button id="prevDay" class="icon-btn" title="Önceki gün">‹</button>
        <button id="dateLabel" class="date-label" title="Bugüne dön"></button>
        <button id="nextDay" class="icon-btn" title="Sonraki gün">›</button>
      </div>

      <div class="progress-wrap">
        <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
        <div class="progress-meta">
          <span id="loggedText" class="logged">0dk</span>
          <span id="remainText" class="remain"></span>
        </div>
      </div>

      <!-- Haftalik mini grafik -->
      <div id="weekBar" class="weekbar"></div>

      <!-- Arama -->
      <div class="search">
        <input id="search" type="text" placeholder="İş ara (anahtar veya metin) ve Enter…" autocomplete="off" />
      </div>

      <!-- Is listesi -->
      <div id="issueList" class="issue-list"></div>
      <div id="emptyIssues" class="empty hidden">İş bulunamadı. Aramayı dene ya da JQL'i ayarlardan değiştir.</div>

      <!-- Bugunun kayitlari -->
      <div class="entries">
        <button id="entriesToggle" class="entries-head" aria-expanded="true">
          <span>Bu günün kayıtları (<span id="entriesCount">0</span>)</span>
          <span id="entriesChevron" class="chev">▾</span>
        </button>
        <div id="entriesBody" class="entries-body"></div>
      </div>

      <div id="error" class="error-bar hidden"></div>
    </section>

    <!-- Yukleniyor -->
    <section id="loading" class="screen">
      <div class="spinner"></div>
    </section>

    <!-- Toast / Geri al -->
    <div id="toast" class="toast hidden">
      <span id="toastMsg"></span>
      <button id="toastAction" class="toast-action"></button>
    </div>

    <!-- Worklog onay penceresi -->
    <div id="logModal" class="modal-overlay hidden">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="lmKey">
        <div class="modal-head">
          <span id="lmKey" class="lm-key"></span>
          <span id="lmDur" class="lm-dur"></span>
        </div>
        <div id="lmSum" class="lm-sum"></div>
        <label class="lm-field">
          <span class="lm-label">Açıklama <em>(opsiyonel)</em></span>
          <textarea id="lmComment" rows="3" placeholder="Ne yaptın? Boş bırakabilirsin…"></textarea>
        </label>
        <div class="modal-actions">
          <button id="lmCancel" type="button" class="ghost-btn">İptal</button>
          <button id="lmSave" type="button" class="primary">Kaydet</button>
        </div>
      </div>
    </div>

    <script type="module" src="dist/popup/main.js"></script>
  </body>
</html>
