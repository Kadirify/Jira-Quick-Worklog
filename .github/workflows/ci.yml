# Her push/PR'da derle + test et; main'de magaza paketini artefakt olarak uret.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Derle + testleri çalıştır
        run: npm test

      - name: Mağaza paketini oluştur
        if: github.ref == 'refs/heads/main'
        run: |
          zip -r jira-quick-worklog.zip \
            manifest.json popup.html options.html popup.css options.css dist icons

      - name: Paketi artefakt olarak yükle
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: jira-quick-worklog
          path: jira-quick-worklog.zip
